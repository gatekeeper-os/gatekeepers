name: tier1
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify reviewed pinned core skill snapshot (not live sync)
        run: python3 .github/check-core-skill-snapshot.py
      - name: Test live-sync availability and failure handling
        run: python3 .github/test-live-core-sync.py
      - name: Probe anonymous core readability
        run: bash .github/live-core-sync.sh probe
      - name: Live core-main fetch and parity (required)
        run: bash .github/live-core-sync.sh fetch
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm check:secrets
